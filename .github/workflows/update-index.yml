name: Update Codebase Index

# Regenerates the .toon index files in packages/ui/src/components/.ai/
# whenever a component changes structurally (imports, props, hooks,
# dependencies). The indexer always rewrites the `generated:` timestamp
# inside each file, so a naive "did anything change?" check would open a
# PR on every run. We use `git diff -I '^generated:'` to ignore hunks
# where every changed line is a `generated:` field, and only open a PR
# when there's a real content change. PRs #71, #90, and #92 were stale
# timestamp-only PRs that were closed by hand before this filter existed.

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/src/components/**"
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run codebase indexer
        run: python .claude/skills/codebase-index/scripts/index_codebase.py ./packages/ui

      - name: Create PR if index changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/components/.ai/

          # No changes at all
          if git diff --staged --quiet; then
            echo "No changes to the index"
            exit 0
          fi

          # Only the regeneration timestamp changed — skip the PR.
          # `-I '^generated:'` tells git to ignore hunks where every
          # added/removed line matches the regex, so a real content
          # change in the same diff still triggers a PR.
          if git diff --staged -I '^generated:' --quiet; then
            echo "Index changes are timestamp-only — skipping PR"
            exit 0
          fi

          # Substantive change — create PR
          BRANCH="chore/update-index-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update codebase index"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: update codebase index" \
            --body "Automated codebase index update from workflow" \
            --base main \
            --head "$BRANCH"
